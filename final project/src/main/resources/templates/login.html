<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Login - JobPortal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#1565c0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:white;padding:2.5rem;border-radius:12px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:1.5rem;font-size:1.6rem;font-weight:bold;color:#1565c0}
h2{text-align:center;color:#333;margin-bottom:1.5rem;font-size:1.3rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.9rem;color:#444}
input{width:100%;padding:.65rem .9rem;border:1px solid #ccc;border-radius:6px;font-size:.95rem}
input:focus{outline:none;border-color:#1565c0}
.btn{width:100%;padding:.8rem;background:#1565c0;color:white;border:none;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:.5rem}
.btn:hover{background:#0d47a1}
.error{background:#ffebee;color:#c62828;padding:.7rem;border-radius:6px;margin-bottom:1rem;font-size:.85rem;text-align:center}
.success{background:#e8f5e9;color:#2e7d32;padding:.7rem;border-radius:6px;margin-bottom:1rem;font-size:.85rem;text-align:center}
.links{text-align:center;margin-top:1rem;font-size:.85rem;color:#666}
.links a{color:#1565c0;text-decoration:none}
.hint{background:#e3f2fd;border-radius:6px;padding:.8rem;margin-top:1rem;font-size:.8rem;color:#555}
.hint b{color:#1565c0}
</style>
</head>
<body>
<div class="card">
  <div class="logo">💼 JobPortal</div>
  <h2>Sign In to Your Account</h2>
  <div class="error" th:if="${error}" th:text="${error}"></div>
  <div class="success" th:if="${success}" th:text="${success}"></div>
  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="you@example.com" required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn">Login</button>
  </form>
  <div class="links">
    <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
    <p style="margin-top:.5rem"><a th:href="@{/}">← Back to Home</a></p>
  </div>
  <div class="hint">
    <b>Demo Accounts:</b><br/>
    Student: student@gmail.com / student123<br/>
    Employer: employer@techcorp.com / emp123<br/>
    Admin: admin@jobportal.com / admin123
  </div>
</div>
</body>
</html>
