<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Applicants - JobPortal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}
.sidebar{width:220px;background:#0d47a1;color:white;padding:1.5rem 0;position:fixed;height:100vh}
.sidebar .logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar nav a{display:block;padding:.75rem 1.5rem;color:#bbdefb;text-decoration:none;font-size:.9rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.15);color:white}
.main{margin-left:220px;padding:2rem;flex:1}
h1{color:#0d47a1;margin-bottom:.5rem}
.job-info{background:#e3f2fd;padding:1rem 1.5rem;border-radius:8px;margin-bottom:1.5rem;font-size:.9rem;color:#1565c0}
.card{background:white;border-radius:10px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse}
th{background:#f5f7fa;color:#555;padding:.75rem 1rem;text-align:left;font-size:.8rem;text-transform:uppercase}
td{padding:.85rem 1rem;border-bottom:1px solid #f0f0f0;font-size:.88rem;vertical-align:top}
tr:last-child td{border-bottom:none}
.badge{padding:.22rem .6rem;border-radius:20px;font-size:.72rem;font-weight:600}
.badge-APPLIED{background:#e3f2fd;color:#1565c0}
.badge-UNDER_REVIEW{background:#fff3e0;color:#e65100}
.badge-SHORTLISTED{background:#e8f5e9;color:#2e7d32}
.badge-REJECTED{background:#ffebee;color:#c62828}
.badge-HIRED{background:#f3e5f5;color:#6a1b9a}
.action-form{display:flex;flex-direction:column;gap:.4rem;min-width:200px}
.action-form select{padding:.4rem;border:1px solid #ddd;border-radius:5px;font-size:.82rem}
.action-form input{padding:.4rem;border:1px solid #ddd;border-radius:5px;font-size:.82rem}
.btn{padding:.35rem .8rem;border:none;border-radius:5px;cursor:pointer;font-size:.78rem;font-weight:bold}
.btn-primary{background:#0d47a1;color:white}
.btn-back{display:inline-block;padding:.55rem 1.1rem;background:#eee;color:#555;border-radius:6px;text-decoration:none;font-size:.88rem;font-weight:bold;margin-bottom:1rem}
.alert-success{background:#e8f5e9;color:#2e7d32;padding:.75rem;border-radius:6px;margin-bottom:1rem}
.cover{font-size:.82rem;color:#666;max-width:200px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">💼 JobPortal</div>
  <nav>
    <a th:href="@{/employer/dashboard}">🏠 Dashboard</a>
    <a th:href="@{/employer/jobs}" class="active">📋 My Jobs</a>
    <a th:href="@{/employer/jobs/add}">➕ Post Job</a>
    <a th:href="@{/employer/profile}">🏢 Company Profile</a>
    <a th:href="@{/logout}" style="margin-top:2rem;border-top:1px solid rgba(255,255,255,.2);padding-top:.75rem">🚪 Logout</a>
  </nav>
</div>
<div class="main">
  <h1>👥 Applicants</h1>
  <div class="job-info">
    <strong th:text="${job.title}"></strong> ·
    <span th:text="${job.companyName}"></span> ·
    <span th:text="${job.location}"></span>
  </div>
  <div th:if="${success}" class="alert-success" th:text="${success}"></div>
  <a th:href="@{/employer/jobs}" class="btn-back">← Back to Jobs</a>
  <div class="card">
    <p style="color:#666;margin-bottom:1rem;font-size:.9rem"
       th:text="${#lists.size(applications)} + ' application(s) received'"></p>
    <table>
      <thead>
        <tr><th>#</th><th>Applicant</th><th>Email</th><th>Skills</th><th>Experience</th><th>Cover Letter</th><th>Applied</th><th>Status</th><th>Update Status</th></tr>
      </thead>
      <tbody>
        <tr th:each="app, stat : ${applications}">
          <td th:text="${stat.count}"></td>
          <td>
            <strong th:text="${app.applicant.fullName}"></strong><br/>
            <span style="font-size:.78rem;color:#888" th:text="${app.applicant.education}"></span>
          </td>
          <td th:text="${app.applicant.email}"></td>
          <td style="font-size:.8rem" th:text="${app.applicant.skills}"></td>
          <td th:text="${app.applicant.experience}"></td>
          <td class="cover" th:text="${app.coverLetter != null ? #strings.abbreviate(app.coverLetter,80) : '—'}"></td>
          <td th:text="${#temporals.format(app.appliedAt,'dd MMM yy')}"></td>
          <td>
            <span class="badge" th:classappend="'badge-' + ${app.status.name()}" th:text="${app.status}"></span>
          </td>
          <td>
            <form th:action="@{/employer/applications/{id}/status(id=${app.id})}" method="post" class="action-form">
              <select name="status">
                <option value="APPLIED" th:selected="${app.status.name()=='APPLIED'}">Applied</option>
                <option value="UNDER_REVIEW" th:selected="${app.status.name()=='UNDER_REVIEW'}">Under Review</option>
                <option value="SHORTLISTED" th:selected="${app.status.name()=='SHORTLISTED'}">Shortlisted</option>
                <option value="REJECTED" th:selected="${app.status.name()=='REJECTED'}">Rejected</option>
                <option value="HIRED" th:selected="${app.status.name()=='HIRED'}">Hired</option>
              </select>
              <input type="text" name="remarks" th:value="${app.employerRemarks}" placeholder="Remarks (optional)"/>
              <button type="submit" class="btn btn-primary">Update</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(applications)}">
          <td colspan="9" style="text-align:center;color:#999;padding:2rem">No applications yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
