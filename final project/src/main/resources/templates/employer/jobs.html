<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>My Jobs - Employer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}
.sidebar{width:220px;background:#0d47a1;color:white;padding:1.5rem 0;position:fixed;height:100vh}
.sidebar .logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar nav a{display:block;padding:.75rem 1.5rem;color:#bbdefb;text-decoration:none;font-size:.9rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.15);color:white}
.main{margin-left:220px;padding:2rem;flex:1}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
h1{color:#0d47a1}
.btn-orange{background:#ff6f00;color:white;padding:.65rem 1.2rem;border-radius:6px;text-decoration:none;font-weight:bold;font-size:.9rem}
.card{background:white;border-radius:10px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse}
th{background:#f5f7fa;color:#555;padding:.75rem 1rem;text-align:left;font-size:.82rem;text-transform:uppercase;letter-spacing:.5px}
td{padding:.85rem 1rem;border-bottom:1px solid #f0f0f0;font-size:.9rem}
tr:last-child td{border-bottom:none}
.badge{padding:.2rem .6rem;border-radius:20px;font-size:.75rem}
.badge-ACTIVE{background:#e8f5e9;color:#2e7d32}
.badge-CLOSED{background:#ffebee;color:#c62828}
.badge-DRAFT{background:#fff3e0;color:#e65100}
.btn{display:inline-block;padding:.35rem .8rem;border-radius:5px;text-decoration:none;font-size:.8rem;font-weight:bold;border:none;cursor:pointer}
.btn-blue{background:#1565c0;color:white}
.btn-green{background:#2e7d32;color:white}
.btn-red{background:#c62828;color:white}
.alert-success{background:#e8f5e9;color:#2e7d32;padding:.75rem;border-radius:6px;margin-bottom:1rem}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">💼 JobPortal</div>
  <nav>
    <a th:href="@{/employer/dashboard}">🏠 Dashboard</a>
    <a th:href="@{/employer/jobs}" class="active">📋 My Jobs</a>
    <a th:href="@{/employer/jobs/add}">➕ Post Job</a>
    <a th:href="@{/employer/profile}">🏢 Company Profile</a>
    <a th:href="@{/logout}" style="margin-top:2rem;border-top:1px solid rgba(255,255,255,.2);padding-top:.75rem">🚪 Logout</a>
  </nav>
</div>
<div class="main">
  <div class="top-bar">
    <h1>📋 My Job Postings</h1>
    <a th:href="@{/employer/jobs/add}" class="btn-orange">+ Post New Job</a>
  </div>
  <div th:if="${success}" class="alert-success" th:text="${success}"></div>
  <div class="card">
    <table>
      <thead>
        <tr><th>#</th><th>Job Title</th><th>Location</th><th>Type</th><th>Category</th><th>Status</th><th>Posted</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr th:each="job, stat : ${jobs}">
          <td th:text="${stat.count}"></td>
          <td><strong th:text="${job.title}"></strong></td>
          <td th:text="${job.location}"></td>
          <td th:text="${job.jobType}"></td>
          <td th:text="${job.category}"></td>
          <td><span class="badge" th:classappend="'badge-' + ${job.status.name()}" th:text="${job.status}"></span></td>
          <td th:text="${#temporals.format(job.postedAt, 'dd MMM yyyy')}"></td>
          <td style="white-space:nowrap;display:flex;gap:4px">
            <a th:href="@{/employer/jobs/{id}/applicants(id=${job.id})}" class="btn btn-green">Applicants</a>
            <a th:href="@{/employer/jobs/edit/{id}(id=${job.id})}" class="btn btn-blue">Edit</a>
            <form th:action="@{/employer/jobs/delete/{id}(id=${job.id})}" method="post" onsubmit="return confirm('Delete this job?')">
              <button type="submit" class="btn btn-red">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(jobs)}">
          <td colspan="8" style="text-align:center;color:#999;padding:2rem">No jobs posted yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
