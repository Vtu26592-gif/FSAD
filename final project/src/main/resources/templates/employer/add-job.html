<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Post Job - JobPortal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}
.sidebar{width:220px;background:#0d47a1;color:white;padding:1.5rem 0;position:fixed;height:100vh}
.sidebar .logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar nav a{display:block;padding:.75rem 1.5rem;color:#bbdefb;text-decoration:none;font-size:.9rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.15);color:white}
.main{margin-left:220px;padding:2rem;flex:1}
h1{color:#0d47a1;margin-bottom:1.5rem}
.card{background:white;border-radius:10px;padding:2rem;box-shadow:0 2px 10px rgba(0,0,0,.09);max-width:750px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.88rem;color:#444}
input,select,textarea{width:100%;padding:.6rem .8rem;border:1px solid #ddd;border-radius:6px;font-size:.93rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0d47a1}
textarea{resize:vertical;min-height:100px}
.error{color:#c62828;font-size:.8rem;margin-top:.2rem}
.actions{display:flex;gap:1rem;margin-top:1rem}
.btn{padding:.7rem 1.5rem;border:none;border-radius:6px;font-size:.95rem;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.btn-primary{background:#ff6f00;color:white}
.btn-primary:hover{background:#e65100}
.btn-back{background:#eee;color:#555}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">💼 JobPortal</div>
  <nav>
    <a th:href="@{/employer/dashboard}">🏠 Dashboard</a>
    <a th:href="@{/employer/jobs}">📋 My Jobs</a>
    <a th:href="@{/employer/jobs/add}" class="active">➕ Post Job</a>
    <a th:href="@{/employer/profile}">🏢 Company Profile</a>
    <a th:href="@{/logout}" style="margin-top:2rem;border-top:1px solid rgba(255,255,255,.2);padding-top:.75rem">🚪 Logout</a>
  </nav>
</div>
<div class="main">
  <h1>➕ Post New Job</h1>
  <div class="card">
    <form th:action="@{/employer/jobs/add}" th:object="${job}" method="post">
      <div class="form-group">
        <label>Job Title *</label>
        <input type="text" th:field="*{title}" placeholder="e.g. Java Backend Developer"/>
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
      </div>
      <div class="form-group">
        <label>Job Description *</label>
        <textarea th:field="*{description}" placeholder="Describe the role, responsibilities, and what you are looking for..."></textarea>
        <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Company Name *</label>
          <input type="text" th:field="*{companyName}" placeholder="Your company name"/>
          <div class="error" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
        </div>
        <div class="form-group">
          <label>Location *</label>
          <input type="text" th:field="*{location}" placeholder="City or Remote"/>
          <div class="error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category *</label>
          <select th:field="*{category}">
            <option value="">-- Select Category --</option>
            <option value="IT">Information Technology</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="HR">Human Resources</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
          <div class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>
        <div class="form-group">
          <label>Job Type *</label>
          <select th:field="*{jobType}">
            <option value="">-- Select --</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Internship">Internship</option>
            <option value="Remote">Remote</option>
            <option value="Contract">Contract</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Experience Required</label>
          <select th:field="*{experienceRequired}">
            <option value="">-- Select --</option>
            <option value="Fresher">Fresher</option>
            <option value="1-2 years">1-2 years</option>
            <option value="3-5 years">3-5 years</option>
            <option value="5+ years">5+ years</option>
          </select>
        </div>
        <div class="form-group">
          <label>Salary Range</label>
          <input type="text" th:field="*{salaryRange}" placeholder="e.g. ₹4L - ₹8L per annum"/>
        </div>
      </div>
      <div class="form-group">
        <label>Skills Required *</label>
        <input type="text" th:field="*{skillsRequired}" placeholder="Java, Spring Boot, MySQL (comma separated)"/>
        <div class="error" th:if="${#fields.hasErrors('skillsRequired')}" th:errors="*{skillsRequired}"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Last Date to Apply</label>
          <input type="date" th:field="*{lastDateToApply}"/>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select th:field="*{status}">
            <option value="ACTIVE">Active</option>
            <option value="DRAFT">Draft</option>
            <option value="CLOSED">Closed</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">📢 Post Job</button>
        <a th:href="@{/employer/jobs}" class="btn btn-back">← Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
