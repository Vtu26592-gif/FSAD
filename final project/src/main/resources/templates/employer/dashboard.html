<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Employer Dashboard - JobPortal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}
.sidebar{width:220px;background:#0d47a1;color:white;padding:1.5rem 0;position:fixed;height:100vh}
.sidebar .logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar nav a{display:block;padding:.75rem 1.5rem;color:#bbdefb;text-decoration:none;font-size:.9rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.15);color:white}
.main{margin-left:220px;padding:2rem;flex:1}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.top-bar h1{color:#0d47a1;font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:white;border-radius:10px;padding:1.5rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.stat-card .num{font-size:2.2rem;font-weight:bold;color:#0d47a1}
.stat-card .lbl{color:#888;font-size:.85rem;margin-top:.3rem}
.card{background:white;border-radius:10px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:1.5rem}
.section-title{font-size:1rem;font-weight:700;color:#0d47a1;margin-bottom:1rem}
.job-row{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid #f0f0f0}
.job-row:last-child{border-bottom:none}
.job-row .title{font-weight:600}
.job-row .meta{font-size:.82rem;color:#888}
.btn{display:inline-block;padding:.4rem .9rem;border-radius:6px;text-decoration:none;font-size:.82rem;font-weight:bold}
.btn-sm{background:#0d47a1;color:white}
.btn-green{background:#2e7d32;color:white;font-size:.8rem}
.btn-orange{background:#ff6f00;color:white;padding:.65rem 1.2rem;font-size:.88rem}
.tag{padding:.2rem .6rem;border-radius:20px;font-size:.72rem;background:#e3f2fd;color:#1565c0}
.tag-active{background:#e8f5e9;color:#2e7d32}
.alert-success{background:#e8f5e9;color:#2e7d32;padding:.75rem;border-radius:6px;margin-bottom:1rem}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">💼 JobPortal</div>
  <nav>
    <a th:href="@{/employer/dashboard}" class="active">🏠 Dashboard</a>
    <a th:href="@{/employer/jobs}">📋 My Jobs</a>
    <a th:href="@{/employer/jobs/add}">➕ Post Job</a>
    <a th:href="@{/employer/profile}">🏢 Company Profile</a>
    <a th:href="@{/logout}" style="margin-top:2rem;border-top:1px solid rgba(255,255,255,.2);padding-top:.75rem">🚪 Logout</a>
  </nav>
</div>
<div class="main">
  <div class="top-bar">
    <h1>Welcome, <span th:text="${employer.companyName ?: employer.fullName}"></span>!</h1>
    <a th:href="@{/employer/jobs/add}" class="btn btn-orange">+ Post New Job</a>
  </div>

  <div th:if="${success}" class="alert-success" th:text="${success}"></div>

  <div class="stats">
    <div class="stat-card"><div class="num" th:text="${totalJobs}">0</div><div class="lbl">Jobs Posted</div></div>
    <div class="stat-card"><div class="num" th:text="${totalApplications}">0</div><div class="lbl">Total Applications</div></div>
    <div class="stat-card"><div class="num" th:text="${shortlisted}">0</div><div class="lbl">Shortlisted</div></div>
  </div>

  <div class="card">
    <div class="section-title">📋 My Job Postings</div>
    <div th:if="${#lists.isEmpty(recentJobs)}" style="color:#999;font-size:.88rem">
      No jobs posted yet. <a th:href="@{/employer/jobs/add}">Post your first job →</a>
    </div>
    <div th:each="job : ${recentJobs}" class="job-row">
      <div>
        <div class="title" th:text="${job.title}"></div>
        <div class="meta">
          <span th:text="${job.location}"></span> ·
          <span th:text="${job.jobType}"></span> ·
          Posted: <span th:text="${#temporals.format(job.postedAt, 'dd MMM yyyy')}"></span>
        </div>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <span class="tag tag-active" th:text="${job.status}"></span>
        <a th:href="@{/employer/jobs/{id}/applicants(id=${job.id})}" class="btn btn-green">View Applicants</a>
        <a th:href="@{/employer/jobs/edit/{id}(id=${job.id})}" class="btn btn-sm">Edit</a>
      </div>
    </div>
    <div style="margin-top:1rem"><a th:href="@{/employer/jobs}" class="btn btn-sm">View All Jobs →</a></div>
  </div>
</div>
</body>
</html>
