<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Manage Users - Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}
.sidebar{width:220px;background:#212121;color:white;padding:1.5rem 0;position:fixed;height:100vh}
.sidebar .logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.15)}
.sidebar nav a{display:block;padding:.75rem 1.5rem;color:#bdbdbd;text-decoration:none;font-size:.9rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.1);color:white}
.main{margin-left:220px;padding:2rem;flex:1}
h1{color:#212121;margin-bottom:1.5rem}
.tabs{display:flex;gap:0;margin-bottom:0;border-bottom:2px solid #e0e0e0}
.tab{padding:.75rem 1.5rem;cursor:pointer;font-weight:600;font-size:.9rem;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:#1565c0;border-bottom-color:#1565c0}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:white;border-radius:0 10px 10px 10px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse}
th{background:#f5f7fa;color:#555;padding:.7rem 1rem;text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.4px}
td{padding:.75rem 1rem;border-bottom:1px solid #f0f0f0;font-size:.88rem}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{padding:.2rem .6rem;border-radius:20px;font-size:.73rem;font-weight:600}
.badge-enabled{background:#e8f5e9;color:#2e7d32}
.badge-disabled{background:#ffebee;color:#c62828}
.btn{display:inline-block;padding:.35rem .8rem;border-radius:5px;font-size:.8rem;font-weight:bold;border:none;cursor:pointer;text-decoration:none}
.btn-toggle-on{background:#c62828;color:white}
.btn-toggle-off{background:#2e7d32;color:white}
.alert-success{background:#e8f5e9;color:#2e7d32;padding:.75rem;border-radius:6px;margin-bottom:1rem}
</style>
<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('content-' + tab).classList.add('active');
  event.target.classList.add('active');
}
</script>
</head>
<body>
<div class="sidebar">
  <div class="logo">⚙️ Admin Panel</div>
  <nav>
    <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
    <a th:href="@{/admin/users}" class="active">👥 Manage Users</a>
    <a th:href="@{/admin/jobs}">💼 Manage Jobs</a>
    <a th:href="@{/}">🌐 View Site</a>
    <a th:href="@{/logout}" style="margin-top:2rem;border-top:1px solid rgba(255,255,255,.1);padding-top:.75rem">🚪 Logout</a>
  </nav>
</div>

<div class="main">
  <h1>👥 Manage Users</h1>
  <div th:if="${success}" class="alert-success" th:text="${success}"></div>

  <div class="tabs">
    <div class="tab active" id="tab-students" onclick="switchTab('students')">🎓 Students (<span th:text="${#lists.size(students)}">0</span>)</div>
    <div class="tab" id="tab-employers" onclick="switchTab('employers')">🏢 Employers (<span th:text="${#lists.size(employers)}">0</span>)</div>
  </div>

  <!-- Students Tab -->
  <div class="tab-content active card" id="content-students">
    <table>
      <thead>
        <tr><th>#</th><th>Name</th><th>Email</th><th>Location</th><th>Experience</th><th>Skills</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody>
        <tr th:each="u, stat : ${students}">
          <td th:text="${stat.count}"></td>
          <td><strong th:text="${u.fullName}"></strong></td>
          <td th:text="${u.email}"></td>
          <td th:text="${u.location ?: '—'}"></td>
          <td th:text="${u.experience ?: '—'}"></td>
          <td style="font-size:.78rem" th:text="${u.skills != null ? #strings.abbreviate(u.skills,40) : '—'}"></td>
          <td>
            <span class="badge" th:classappend="${u.enabled} ? 'badge-enabled' : 'badge-disabled'"
                  th:text="${u.enabled} ? 'Active' : 'Disabled'"></span>
          </td>
          <td>
            <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline">
              <button type="submit" class="btn"
                      th:classappend="${u.enabled} ? 'btn-toggle-on' : 'btn-toggle-off'"
                      th:text="${u.enabled} ? 'Disable' : 'Enable'"></button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}">
          <td colspan="8" style="text-align:center;color:#999;padding:2rem">No students registered yet.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Employers Tab -->
  <div class="tab-content card" id="content-employers">
    <table>
      <thead>
        <tr><th>#</th><th>Contact</th><th>Email</th><th>Company</th><th>Industry</th><th>Location</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody>
        <tr th:each="u, stat : ${employers}">
          <td th:text="${stat.count}"></td>
          <td><strong th:text="${u.fullName}"></strong></td>
          <td th:text="${u.email}"></td>
          <td th:text="${u.companyName ?: '—'}"></td>
          <td th:text="${u.industry ?: '—'}"></td>
          <td th:text="${u.location ?: '—'}"></td>
          <td>
            <span class="badge" th:classappend="${u.enabled} ? 'badge-enabled' : 'badge-disabled'"
                  th:text="${u.enabled} ? 'Active' : 'Disabled'"></span>
          </td>
          <td>
            <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline">
              <button type="submit" class="btn"
                      th:classappend="${u.enabled} ? 'btn-toggle-on' : 'btn-toggle-off'"
                      th:text="${u.enabled} ? 'Disable' : 'Enable'"></button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employers)}">
          <td colspan="8" style="text-align:center;color:#999;padding:2rem">No employers registered yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
