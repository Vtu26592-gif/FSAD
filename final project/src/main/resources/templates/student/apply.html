<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Apply - JobPortal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}
.sidebar{width:220px;background:#1565c0;color:white;padding:1.5rem 0;position:fixed;height:100vh}
.sidebar .logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar nav a{display:block;padding:.75rem 1.5rem;color:#bbdefb;text-decoration:none;font-size:.9rem}
.sidebar nav a:hover{background:rgba(255,255,255,.15);color:white}
.main{margin-left:220px;padding:2rem;flex:1}
.container{max-width:700px}
h1{color:#1565c0;margin-bottom:1.5rem}
.job-summary{background:#e3f2fd;padding:1.2rem 1.5rem;border-radius:8px;margin-bottom:1.5rem}
.job-summary h2{color:#1565c0;margin-bottom:.3rem}
.job-summary p{color:#555;font-size:.9rem}
.card{background:white;border-radius:10px;padding:2rem;box-shadow:0 2px 10px rgba(0,0,0,.09)}
.form-group{margin-bottom:1.2rem}
label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.9rem;color:#444}
textarea{width:100%;padding:.7rem .9rem;border:1px solid #ddd;border-radius:6px;font-size:.93rem;resize:vertical;min-height:120px;font-family:inherit}
textarea:focus{outline:none;border-color:#1565c0}
.resume-info{background:#f5f7fa;padding:1rem;border-radius:8px;font-size:.88rem;color:#555}
.resume-info .filename{font-weight:600;color:#1565c0}
.btn{padding:.75rem 1.5rem;border:none;border-radius:6px;font-size:.95rem;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.btn-primary{background:#1565c0;color:white}
.btn-primary:hover{background:#0d47a1}
.btn-back{background:#eee;color:#555}
.error{background:#ffebee;color:#c62828;padding:.75rem;border-radius:6px;margin-bottom:1rem}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">💼 JobPortal</div>
  <nav>
    <a th:href="@{/student/dashboard}">🏠 Dashboard</a>
    <a th:href="@{/student/jobs}" class="active">🔍 Browse Jobs</a>
    <a th:href="@{/student/applications}">📋 My Applications</a>
    <a th:href="@{/student/profile}">👤 My Profile</a>
    <a th:href="@{/logout}" style="margin-top:2rem;border-top:1px solid rgba(255,255,255,.2);padding-top:.75rem">🚪 Logout</a>
  </nav>
</div>
<div class="main">
  <div class="container">
    <h1>Apply for Job</h1>
    <div class="job-summary">
      <h2 th:text="${job.title}"></h2>
      <p th:text="${job.companyName + ' · ' + job.location + ' · ' + job.jobType}"></p>
    </div>
    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="card">
      <form th:action="@{/student/jobs/{id}/apply(id=${job.id})}" method="post">
        <div class="form-group">
          <label>Resume on File</label>
          <div class="resume-info">
            <span th:if="${student.resumeFileName}">📎 <span class="filename" th:text="${student.resumeFileName}"></span> will be submitted</span>
            <span th:unless="${student.resumeFileName}">
              ⚠️ No resume uploaded. <a th:href="@{/student/profile}">Upload resume in your profile</a> before applying.
            </span>
          </div>
        </div>
        <div class="form-group">
          <label>Cover Letter <span style="color:#999;font-weight:400">(optional)</span></label>
          <textarea name="coverLetter" placeholder="Tell the employer why you're a great fit for this role..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">✅ Submit Application</button>
        &nbsp;
        <a th:href="@{/student/jobs}" class="btn btn-back">← Cancel</a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
