<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>My Applications - JobPortal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}
.sidebar{width:220px;background:#1565c0;color:white;padding:1.5rem 0;position:fixed;height:100vh}
.sidebar .logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar nav a{display:block;padding:.75rem 1.5rem;color:#bbdefb;text-decoration:none;font-size:.9rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.15);color:white}
.main{margin-left:220px;padding:2rem;flex:1}
h1{color:#1565c0;margin-bottom:.5rem}
.subtitle{color:#888;margin-bottom:1.5rem;font-size:.9rem}
.card{background:white;border-radius:10px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.filter-bar{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.filter-btn{padding:.35rem .85rem;border:1px solid #ddd;border-radius:20px;background:white;cursor:pointer;font-size:.82rem;color:#555}
.filter-btn.active,.filter-btn:hover{background:#1565c0;color:white;border-color:#1565c0}
table{width:100%;border-collapse:collapse}
th{background:#f5f7fa;color:#555;padding:.75rem 1rem;text-align:left;font-size:.82rem;text-transform:uppercase;letter-spacing:.5px}
td{padding:.85rem 1rem;border-bottom:1px solid #f0f0f0;font-size:.9rem}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{padding:.25rem .7rem;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-APPLIED{background:#e3f2fd;color:#1565c0}
.badge-UNDER_REVIEW{background:#fff3e0;color:#e65100}
.badge-SHORTLISTED{background:#e8f5e9;color:#2e7d32}
.badge-REJECTED{background:#ffebee;color:#c62828}
.badge-HIRED{background:#f3e5f5;color:#6a1b9a}
.company{font-size:.82rem;color:#888}
.no-data{text-align:center;padding:3rem;color:#aaa}
.alert-success{background:#e8f5e9;color:#2e7d32;padding:.75rem;border-radius:6px;margin-bottom:1rem}
</style>
<script>
function filterTable(status) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('tbody tr').forEach(row => {
    const badge = row.querySelector('.badge');
    if (!badge) return;
    row.style.display = (status === 'ALL' || badge.textContent.trim() === status) ? '' : 'none';
  });
}
</script>
</head>
<body>
<div class="sidebar">
  <div class="logo">💼 JobPortal</div>
  <nav>
    <a th:href="@{/student/dashboard}">🏠 Dashboard</a>
    <a th:href="@{/student/jobs}">🔍 Browse Jobs</a>
    <a th:href="@{/student/applications}" class="active">📋 My Applications</a>
    <a th:href="@{/student/profile}">👤 My Profile</a>
    <a th:href="@{/logout}" style="margin-top:2rem;border-top:1px solid rgba(255,255,255,.2);padding-top:.75rem">🚪 Logout</a>
  </nav>
</div>
<div class="main">
  <h1>📋 My Applications</h1>
  <div class="subtitle" th:text="${#lists.size(applications)} + ' total applications'"></div>

  <div th:if="${success}" class="alert-success" th:text="${success}"></div>

  <div class="card">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterTable('ALL')">All</button>
      <button class="filter-btn" onclick="filterTable('APPLIED')">Applied</button>
      <button class="filter-btn" onclick="filterTable('UNDER_REVIEW')">Under Review</button>
      <button class="filter-btn" onclick="filterTable('SHORTLISTED')">Shortlisted</button>
      <button class="filter-btn" onclick="filterTable('REJECTED')">Rejected</button>
      <button class="filter-btn" onclick="filterTable('HIRED')">Hired</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Job Title</th>
          <th>Company</th>
          <th>Location</th>
          <th>Applied On</th>
          <th>Status</th>
          <th>Remarks</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="app, stat : ${applications}">
          <td th:text="${stat.count}"></td>
          <td>
            <strong th:text="${app.job.title}"></strong>
            <div class="company" th:text="${app.job.jobType}"></div>
          </td>
          <td th:text="${app.job.companyName}"></td>
          <td th:text="${app.job.location}"></td>
          <td th:text="${#temporals.format(app.appliedAt, 'dd MMM yyyy')}"></td>
          <td>
            <span class="badge" th:classappend="'badge-' + ${app.status.name()}" th:text="${app.status}"></span>
          </td>
          <td th:text="${app.employerRemarks ?: '—'}" style="font-size:.82rem;color:#666"></td>
        </tr>
      </tbody>
    </table>
    <div th:if="${#lists.isEmpty(applications)}" class="no-data">
      No applications yet. <a th:href="@{/student/jobs}">Browse jobs →</a>
    </div>
  </div>
</div>
</body>
</html>
