<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>My Profile - JobPortal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}
.sidebar{width:220px;background:#1565c0;color:white;padding:1.5rem 0;position:fixed;height:100vh}
.sidebar .logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2)}
.sidebar nav a{display:block;padding:.75rem 1.5rem;color:#bbdefb;text-decoration:none;font-size:.9rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.15);color:white}
.main{margin-left:220px;padding:2rem;flex:1}
h1{color:#1565c0;margin-bottom:1.5rem}
.card{background:white;border-radius:10px;padding:2rem;box-shadow:0 2px 10px rgba(0,0,0,.09);max-width:700px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.88rem;color:#444}
input,select,textarea{width:100%;padding:.6rem .8rem;border:1px solid #ddd;border-radius:6px;font-size:.93rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1565c0}
input[type=file]{padding:.4rem}
.btn{padding:.75rem 1.5rem;background:#1565c0;color:white;border:none;border-radius:6px;font-size:.95rem;font-weight:bold;cursor:pointer}
.btn:hover{background:#0d47a1}
.alert-success{background:#e8f5e9;color:#2e7d32;padding:.75rem;border-radius:6px;margin-bottom:1rem}
.resume-box{background:#f5f7fa;padding:1rem;border-radius:8px;font-size:.88rem}
.resume-box .file{font-weight:600;color:#1565c0}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">💼 JobPortal</div>
  <nav>
    <a th:href="@{/student/dashboard}">🏠 Dashboard</a>
    <a th:href="@{/student/jobs}">🔍 Browse Jobs</a>
    <a th:href="@{/student/applications}">📋 My Applications</a>
    <a th:href="@{/student/profile}" class="active">👤 My Profile</a>
    <a th:href="@{/logout}" style="margin-top:2rem;border-top:1px solid rgba(255,255,255,.2);padding-top:.75rem">🚪 Logout</a>
  </nav>
</div>
<div class="main">
  <h1>👤 My Profile</h1>
  <div th:if="${success}" class="alert-success" th:text="${success}"></div>
  <div class="card">
    <form th:action="@{/student/profile/update}" method="post" th:object="${student}" enctype="multipart/form-data">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" th:field="*{fullName}"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" th:field="*{email}" readonly style="background:#f5f5f5"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <input type="text" th:field="*{phone}" placeholder="10-digit number"/>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" th:field="*{location}" placeholder="City, State"/>
        </div>
      </div>
      <div class="form-group">
        <label>Skills (comma separated)</label>
        <input type="text" th:field="*{skills}" placeholder="Java, Spring Boot, MySQL, React"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Experience Level</label>
          <select th:field="*{experience}">
            <option value="">-- Select --</option>
            <option value="Fresher">Fresher</option>
            <option value="1-2 years">1-2 years</option>
            <option value="3-5 years">3-5 years</option>
            <option value="5+ years">5+ years</option>
          </select>
        </div>
        <div class="form-group">
          <label>Education</label>
          <input type="text" th:field="*{education}" placeholder="B.Tech CSE, 2024"/>
        </div>
      </div>
      <div class="form-group">
        <label>Upload Resume (PDF/DOC)</label>
        <div class="resume-box" th:if="${student.resumeFileName}">
          Current: <span class="file" th:text="${student.resumeFileName}"></span>
        </div>
        <input type="file" name="resumeFile" accept=".pdf,.doc,.docx" style="margin-top:.5rem"/>
        <small style="color:#888">Max 5MB. PDF preferred.</small>
      </div>
      <button type="submit" class="btn">💾 Save Profile</button>
    </form>
  </div>
</div>
</body>
</html>
