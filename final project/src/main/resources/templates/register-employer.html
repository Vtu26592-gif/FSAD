<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Employer Register - JobPortal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fa}
nav{background:#1565c0;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
nav a{color:white;text-decoration:none;font-weight:bold}
.container{max-width:600px;margin:2rem auto;background:white;padding:2rem;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
h1{color:#1565c0;margin-bottom:1.5rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{margin-bottom:1.1rem}
label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.88rem;color:#444}
input,select,textarea{width:100%;padding:.6rem .8rem;border:1px solid #ddd;border-radius:6px;font-size:.93rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1565c0}
textarea{resize:vertical;min-height:70px}
.error{color:#c62828;font-size:.8rem;margin-top:.2rem}
.btn{padding:.75rem 2rem;background:#ff6f00;color:white;border:none;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer}
.btn:hover{background:#e65100}
.link{color:#1565c0;text-decoration:none;font-size:.88rem}
</style>
</head>
<body>
<nav><a th:href="@{/}">💼 JobPortal</a><a th:href="@{/login}">Login</a></nav>
<div class="container">
  <h1>🏢 Employer Registration</h1>
  <form th:action="@{/register/employer}" th:object="${user}" method="post">
    <div class="form-row">
      <div class="form-group">
        <label>Contact Person Name *</label>
        <input type="text" th:field="*{fullName}" placeholder="HR Manager name"/>
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
      </div>
      <div class="form-group">
        <label>Work Email *</label>
        <input type="email" th:field="*{email}" placeholder="hr@company.com"/>
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Password *</label>
        <input type="password" th:field="*{password}" placeholder="Min 6 characters"/>
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>
      <div class="form-group">
        <label>Company Name *</label>
        <input type="text" th:field="*{companyName}" placeholder="Your company name"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Industry</label>
        <select th:field="*{industry}">
          <option value="">-- Select --</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Finance">Finance</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Consulting">Consulting</option>
          <option value="Manufacturing">Manufacturing</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" th:field="*{location}" placeholder="City, State"/>
      </div>
    </div>
    <div class="form-group">
      <label>Company Website</label>
      <input type="text" th:field="*{website}" placeholder="https://yourcompany.com"/>
    </div>
    <div class="form-group">
      <label>Company Description</label>
      <textarea th:field="*{companyDescription}" placeholder="Brief description of your company..."></textarea>
    </div>
    <button type="submit" class="btn">Register as Employer</button>
    &nbsp; <a th:href="@{/register}" class="link">← Change role</a>
  </form>
</div>
</body>
</html>
